name: build-all

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: Generator seed (defaults to run number; change to simulate new PR churn)
        required: false

# 4 chained matrix jobs x 256 (the per-job matrix cap) = 1024 apps, all serial.
env:
  TOTAL: "1024"
  PER_BATCH: "256"

jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      indices: ${{ steps.plan.outputs.indices }}
      seed: ${{ steps.plan.outputs.seed }}
    steps:
      - id: plan
        run: |
          echo "indices=$(seq -s, 0 $((PER_BATCH - 1)) | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
          echo "seed=${{ inputs.seed || github.run_number }}" >> "$GITHUB_OUTPUT"

  build-0:
    needs: [plan]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      max-parallel: 1 # one build at a time, each in its own job / sticky-disk mount
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indices) }}
    name: app-${{ 0 * 256 + matrix.index }}
    env:
      GOCACHE: /mnt/go-cache/build
      GOMODCACHE: /mnt/go-cache/mod
      APP_INDEX: ${{ 0 * 256 + matrix.index }}
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-go-cache
          path: /mnt/go-cache

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # sticky disk handles caching

      - name: Generate app
        run: go run ./tools/gen -n "$TOTAL" -seed "${{ needs.plan.outputs.seed }}" -only "$APP_INDEX" -out apps

      - name: Build app
        run: ./scripts/build-all.sh

  build-1:
    needs: [plan, build-0]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      max-parallel: 1 # one build at a time, each in its own job / sticky-disk mount
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indices) }}
    name: app-${{ 1 * 256 + matrix.index }}
    env:
      GOCACHE: /mnt/go-cache/build
      GOMODCACHE: /mnt/go-cache/mod
      APP_INDEX: ${{ 1 * 256 + matrix.index }}
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-go-cache
          path: /mnt/go-cache

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # sticky disk handles caching

      - name: Generate app
        run: go run ./tools/gen -n "$TOTAL" -seed "${{ needs.plan.outputs.seed }}" -only "$APP_INDEX" -out apps

      - name: Build app
        run: ./scripts/build-all.sh

  build-2:
    needs: [plan, build-1]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      max-parallel: 1 # one build at a time, each in its own job / sticky-disk mount
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indices) }}
    name: app-${{ 2 * 256 + matrix.index }}
    env:
      GOCACHE: /mnt/go-cache/build
      GOMODCACHE: /mnt/go-cache/mod
      APP_INDEX: ${{ 2 * 256 + matrix.index }}
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-go-cache
          path: /mnt/go-cache

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # sticky disk handles caching

      - name: Generate app
        run: go run ./tools/gen -n "$TOTAL" -seed "${{ needs.plan.outputs.seed }}" -only "$APP_INDEX" -out apps

      - name: Build app
        run: ./scripts/build-all.sh

  build-3:
    needs: [plan, build-2]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      max-parallel: 1 # one build at a time, each in its own job / sticky-disk mount
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indices) }}
    name: app-${{ 3 * 256 + matrix.index }}
    env:
      GOCACHE: /mnt/go-cache/build
      GOMODCACHE: /mnt/go-cache/mod
      APP_INDEX: ${{ 3 * 256 + matrix.index }}
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-go-cache
          path: /mnt/go-cache

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # sticky disk handles caching

      - name: Generate app
        run: go run ./tools/gen -n "$TOTAL" -seed "${{ needs.plan.outputs.seed }}" -only "$APP_INDEX" -out apps

      - name: Build app
        run: ./scripts/build-all.sh
