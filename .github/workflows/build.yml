name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Generator seed (defaults to run number)
        required: false
      count:
        description: Number of apps to build in this run
        required: false
        default: "100"

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      GOCACHE: /mnt/go-cache/build
      GOMODCACHE: /mnt/go-cache/mod
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-go-cache
          path: /mnt/go-cache

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # sticky disk handles caching

      - name: Generate app(s)
        run: |
          SEED="${{ inputs.seed || github.run_number }}"
          COUNT="${{ inputs.count || '100' }}"
          echo "seed=$SEED count=$COUNT"
          go run ./tools/gen -n "$COUNT" -seed "$SEED" -out apps

      # Harness round 2: comment-only change.
      - name: Build
        run: ./scripts/build-all.sh

      - name: Clean go caches if oversized
        run: |
          size_gb() { [ -d "$1" ] && du -sBG "$1" | cut -f1 | tr -d 'G' || echo 0; }
          BUILD_GB=$(size_gb "$(go env GOCACHE)")
          MOD_GB=$(size_gb "$(go env GOMODCACHE)")
          echo "GOCACHE=${BUILD_GB}G GOMODCACHE=${MOD_GB}G"
          if [ "$BUILD_GB" -gt 67 ]; then echo "GOCACHE over limit, wiping"; go clean -cache; fi
          if [ "$MOD_GB" -gt 9 ]; then echo "GOMODCACHE over limit, wiping"; go clean -modcache; fi
