name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: Generator seed (defaults to run number)
        required: false
      count:
        description: Number of apps to build in this run
        required: false
        default: "100"

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      GOCACHE: /mnt/go-cache/build
      GOMODCACHE: /mnt/go-cache/mod
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-go-cache
          path: /mnt/go-cache

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # sticky disk handles caching

      - name: Generate app(s)
        run: |
          SEED="${{ inputs.seed || github.run_number }}"
          COUNT="${{ inputs.count || '100' }}"
          echo "seed=$SEED count=$COUNT"
          go run ./tools/gen -n "$COUNT" -seed "$SEED" -out apps

      - name: Build
        run: ./scripts/build-all.sh

      - name: Clean go cache if oversized
        run: |
          USED_GB=$(du -sBG "$(go env GOCACHE)" | cut -f1 | tr -d 'G')
          if [ "$USED_GB" -gt 67 ]; then go clean -cache; fi
